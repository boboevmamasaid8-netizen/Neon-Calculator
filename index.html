<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Calculator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;background:#080b16;color:white;
 font-family:Arial,sans-serif;
}
.calculator{
 width:330px;padding:22px;border-radius:25px;
 background:#111827;box-shadow:0 0 25px #00eaff33;
 border:1px solid #26354b;
}
h2{text-align:center;color:#00eaff;letter-spacing:2px}
#display{
 width:100%;height:80px;margin-bottom:20px;
 background:#080b16;border:1px solid #00eaff;
 border-radius:12px;color:#00ffff;font-size:32px;
 text-align:right;padding:15px;outline:none;
}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{
 height:58px;border:1px solid #26354b;border-radius:13px;
 background:#1b2638;color:white;font-size:21px;
}
button:active{background:#00eaff;color:#08101c}
.op{color:#00eaff}
.equal{background:#00c8e8;color:#07111b}
.clear{color:#ff6688}
</style>
</head>
<body>
<div class="calculator">
<h2>NEON CALCULATOR</h2>
<input id="display" value="0" readonly>
<div class="buttons">
<button class="clear" onclick="clearAll()">AC</button>
<button class="op" onclick="del()">⌫</button>
<button class="op" onclick="add('%')">%</button>
<button class="op" onclick="add('/')">÷</button>
<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="op" onclick="add('*')">×</button>
<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="op" onclick="add('-')">−</button>
<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="op" onclick="add('+')">+</button>
<button onclick="add('0')">0</button>
<button onclick="add('00')">00</button>
<button onclick="add('.')">.</button>
<button class="equal" onclick="calculate()">=</button>
</div>
</div>
<script>
let expression='',finished=false;
const display=document.getElementById('display');
function add(v){
 if(finished){expression='';finished=false}
 if(expression.length>35)return;
 expression+=v;
 display.value=expression.replace(/\*/g,'×').replace(/\//g,'÷')||'0';
}
function clearAll(){expression='';finished=false;display.value='0'}
function del(){
 expression=expression.slice(0,-1);
 display.value=expression.replace(/\*/g,'×').replace(/\//g,'÷')||'0';
}
function calculate(){
 try{
  if(!expression||!/^[0-9+\-*/%.() ]+$/.test(expression))return;
  let result=Function('"use strict";return ('+expression+')')();
  if(!Number.isFinite(result)){display.value='Error';expression='';return}
  expression=String(Number(result.toPrecision(12)));
  display.value=expression;finished=true;
 }catch(e){display.value='Error';expression=''}
}
</script>
</body>
  </html>
